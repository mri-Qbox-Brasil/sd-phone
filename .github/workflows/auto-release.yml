name: Auto release

# MRI: publishes v<version>-mri.1 once CI passes on main with a fxmanifest version that has no MRI release yet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Release new version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(grep -oE "^version '[^']+'" fxmanifest.lua | cut -d"'" -f2)
          [ -n "$version" ] || { echo "::error::no version in fxmanifest.lua"; exit 1; }
          if git tag -l "v${version}-mri.*" | grep -q .; then
            echo "v${version} already has an MRI release"; exit 0
          fi
          tag="v${version}-mri.1"
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
          # A release made with GITHUB_TOKEN doesn't fire `release: published`, so package it directly.
          gh workflow run release.yml -f tag="$tag"
